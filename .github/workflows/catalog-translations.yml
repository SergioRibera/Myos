name: catalog translations

# Translates catalog names offline and opens a pull request with the result
# (tools/catalog-build/translations/<lang>.tsv) for review. Nothing leaves
# the runner: exercises use the curated glossary (glossary-<lang>.tsv), foods
# an offline machine-translation model pinned by SHA-256. Rows marked
# `human` are never touched: fix a translation by editing it and setting its
# origin to `human`. Merging the pull request rebuilds the catalog (the
# `catalog` workflow runs on changes under tools/catalog-build/).
#
# Pull requests opened with the workflow token need "Allow GitHub Actions to
# create and approve pull requests" in the repository settings.

on:
  workflow_dispatch:
  # New source names (pinned sources or the pipeline changed) or glossary
  # edits.
  push:
    branches: [main]
    paths:
      - "tools/catalog-build/src/**"
      - "tools/catalog-build/translate.py"
      - "tools/catalog-build/translations/glossary-*.tsv"
      - "tools/catalog-build/test_translate.py"
  # Picks up anything a missed run left behind.
  schedule:
    - cron: "0 4 1 * *"

permissions: {}

concurrency:
  group: catalog-translations
  cancel-in-progress: true

jobs:
  translate:
    name: translate and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      CACHE_DIR: ${{ github.workspace }}/.catalog-cache
      MODEL_CACHE: ${{ github.workspace }}/.mt-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CACHE_DIR }}
            ${{ env.MODEL_CACHE }}
          key: catalog-translate-${{ hashFiles('tools/catalog-build/src/fetch.rs', 'tools/catalog-build/translate.py') }}

      - name: English names
        run: |
          set -euo pipefail
          cargo run --release --locked -p catalog-build -- \
            catalog --out "$RUNNER_TEMP/dist" --version 1 --cache "$CACHE_DIR"
          cargo run --release --locked -p catalog-build -- \
            names --catalog "$RUNNER_TEMP/dist/catalog.db" --out "$RUNNER_TEMP/names.tsv"

      - name: translate
        run: |
          set -euo pipefail
          python3 -m unittest tools/catalog-build/test_translate.py
          pip install --quiet ctranslate2==4.7.1 sentencepiece==0.2.1
          for table in tools/catalog-build/translations/glossary-??.tsv; do
            lang=${table##*/glossary-}
            lang=${lang%.tsv}
            python3 tools/catalog-build/translate.py "$RUNNER_TEMP/names.tsv" \
              "tools/catalog-build/translations/$lang.tsv" --model-cache "$MODEL_CACHE"
          done

      - name: pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/catalog-build/translations; then
            echo "translations up to date"
            exit 0
          fi
          branch=catalog/translations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add tools/catalog-build/translations
          git commit -m "chore(catalog): update machine translations"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --head "$branch" --base main \
              --title "chore(catalog): update machine translations" \
              --body "Generated by the catalog translations workflow. Rows with origin \`machine\` / \`glossary\` are automatic: correct any of them by editing the translation and setting its origin to \`human\`."
          fi
