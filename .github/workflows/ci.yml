name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  msrv:
    name: cargo check (MSRV 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: '8.7' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,x86_64-linux-android' }
      - uses: Swatinem/rust-cache@v2
      # OpenSSL (vendored, behind SQLCipher) looks for `<target>-ranlib`; NDK r23+
      # ships only the LLVM binutils.
      - name: NDK binutils for OpenSSL
        run: |
          bin="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64_linux_android armv7_linux_androideabi x86_64_linux_android i686_linux_android; do
            echo "AR_$target=$bin/llvm-ar" >> "$GITHUB_ENV"
            echo "RANLIB_$target=$bin/llvm-ranlib" >> "$GITHUB_ENV"
          done
      # The Gradle plugin builds the Rust crate for every ABI.
      - name: assemble debug APK
        working-directory: android
        run: gradle assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: ios build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios-sim,x86_64-apple-ios' }
      - uses: Swatinem/rust-cache@v2
      - name: install xcodegen
        run: brew install xcodegen
      # build.rs writes the xcodegen fragment and ios/.istmo/.
      - name: generate istmo files
        run: cargo check
      - name: generate xcodeproj
        working-directory: ios
        run: xcodegen generate
      - name: xcodebuild
        working-directory: ios
        run: |
          xcodebuild \
            -project MyosApp.xcodeproj \
            -scheme  MyosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build

  nix-bundle:
    name: nix bundle desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: nix
        uses: ./.github/actions/setup-nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          watch-store: "true"
      - run: nix flake check
      - run: nix build .#bundles
      - name: Push results to attic
        if: always()
        uses: ./.github/actions/attic-push
        with:
          push-enabled: ${{ steps.nix.outputs.push-enabled }}
          paths: result
          closure-of: .#bundles .#checks.x86_64-linux.crates
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-bundle
          path: result/


  site:
    name: site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      # The committed copy is what hosts without Nix build from.
      - name: src/data/targets.json matches nix/targets.nix
        run: |
          nix eval --json --file ../nix/targets.nix | jq . > src/data/targets.json
          git diff --exit-code -- src/data/targets.json \
            || { echo "::error::site/src/data/targets.json is stale: run \`node site/scripts/data.mjs\`"; exit 1; }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm build

