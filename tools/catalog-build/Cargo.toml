[package]
name = "catalog-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Builds, signs and publishes the Myos reference files (CI only, never shipped)"
publish = false

[dependencies]
csv = "1"
flate2 = "1"
getrandom = "0.4"
myos-catalog-update = { path = "../../crates/catalog-update" }
myos-core = { path = "../../crates/core" }
myos-store = { path = "../../crates/store" }
myos-sync-wire = { path = "../../crates/sync-wire" }
rusqlite = { version = "0.43", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1.29", features = ["v5"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
redundant_pub_crate = "allow"
# Source names (FoodData Central, ODbL) read better unquoted in this tool.
doc_markdown = "allow"
