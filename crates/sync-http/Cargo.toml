[package]
name = "myos-sync-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Myos sync transport over HTTPS"
publish = false

[dependencies]
myos-store = { path = "../store" }
thiserror = "2.0"
# rustls + webpki roots (ring): no system TLS library on any target.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
