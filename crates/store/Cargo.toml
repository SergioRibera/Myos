[package]
name = "myos-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Myos on-device storage: encrypted SQLite, migrations, sync outbox"
publish = false

[dependencies]
# OS randomness for database keys.
getrandom = "0.4"
# Deterministic ids for natural keys (`HMAC-SHA256`, recomputable server-side).
hmac = "0.13"
jiff = { version = "1.0", default-features = false, features = ["std"] }
myos-core = { path = "../core" }
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"
uuid = { version = "1.29", features = ["v7", "v8"] }
# Wipes database keys from memory on drop.
zeroize = "1.9"

# SQLCipher everywhere. Apple targets use CommonCrypto (built on a macOS
# host); every other target links a vendored OpenSSL, since Android's NDK and
# Windows ship no libcrypto to link against.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["bundled-sqlcipher", "cache"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
# Contradicts rustc `unreachable_pub`, which asks for `pub(crate)` on items
# of private modules.
redundant_pub_crate = "allow"
