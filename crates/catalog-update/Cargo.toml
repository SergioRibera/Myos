[package]
name = "myos-catalog-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Signed manifest and verified downloads of the Myos reference files"
publish = false

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.10"
thiserror = "2.0"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
