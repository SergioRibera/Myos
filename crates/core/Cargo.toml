[package]
name = "myos-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Myos domain model and muscle-impact engine (pure, no I/O)"
publish = false

[dependencies]
# Civil dates and timestamps only: a session stores the local date the user
# trained on, so the core never needs a time-zone database.
jiff = { version = "1.0", default-features = false, features = ["std"] }
# v7: time-ordered ids minted offline on any device and merged on sync.
uuid ={ version = "1.29", features = ["v7"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
